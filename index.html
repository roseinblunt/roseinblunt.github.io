<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>roseinblunt!</title>

<link rel="icon" type="image/x-icon" href="favicon5.ico">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: 'IM Fell English', serif;
    color: white;
    isolation: isolate;
}

/* VIDEO */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100vw;
    min-height: 100vh;
    object-fit: cover;
    z-index: -2;
    mix-blend-mode: difference;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* LOGO */
.logo {
    width: 300px;
    margin-bottom: 50px;
    animation: shake 0.3s infinite, flicker 2s infinite;
    mix-blend-mode: difference;
}

/* BUTTON SHAKE */
.main-btn, .secondary {
    animation: shakeSmall 0.2s infinite;
}

@keyframes shakeSmall {
    0% { transform: translate(0,0); }
    50% { transform: translate(0.7px,-0.7px); }
    100% { transform: translate(0,0); }
}

/* LOGO SHAKE */
@keyframes shake {
    0% { transform: translate(0,0); }
    50% { transform: translate(0.4px,-0.4px); }
    100% { transform: translate(0,0); }
}

/* flicker */
@keyframes flicker {
    0% { opacity:1 }
    50% { opacity:0.9 }
    100% { opacity:1 }
}

.main-btn {
    color:white;
    text-decoration:none;
    letter-spacing:3px;
    text-shadow:0 0 5px white;
    mix-blend-mode:difference;
}

.secondary {
    margin-top:20px;
    font-size:12px;
    opacity:0.3;
}

.whisper {
    position:absolute;
    bottom:30px;
    font-size:10px;
    opacity:0.15;
}

.glitch {
    animation: glitch 0.25s;
}

@keyframes glitch {
    0% { transform:translate(0); }
    20% { transform:translate(-5px,3px); filter:invert(1);}
    100% { transform:translate(0); }
}

</style>
</head>

<body>

<audio id="hoverSound" src="hover.mp3"></audio>
<audio id="clickSound" src="click.mp3"></audio>

<video autoplay muted loop playsinline id="bg-video">
<source src="video2.mp4">
</video>

<div class="overlay"></div>

<div class="container">
<img src="logo.png" class="logo" id="logo">

<a href="links.html" class="main-btn" id="invoke">† LINKS †</a>

<div class="secondary">† MERCH † (soon)</div>
<div class="secondary">† TICKETS † (soon)</div>
</div>

<div class="whisper">nothing is real</div>

<script>
let audioUnlocked=false;
const hoverSound=document.getElementById("hoverSound");
const clickSound=document.getElementById("clickSound");

function unlock(){
 if(!audioUnlocked){
  audioUnlocked=true;
 }
}
document.addEventListener("click",unlock);

document.querySelectorAll("a,.secondary,#logo").forEach(el=>{
 el.addEventListener("mouseenter",()=>{
  if(!audioUnlocked)return;
  hoverSound.currentTime=0;
  hoverSound.play();
 });
});

document.getElementById("invoke").onclick=function(e){
 e.preventDefault();
 clickSound.play();
 document.body.classList.add("glitch");
 setTimeout(()=>location.href="links.html",200);
};

document.getElementById("logo").onclick=()=>{
 clickSound.play();
 location.href="secret.html";
};
</script>

</body>
</html>
