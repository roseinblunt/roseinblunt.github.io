<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>roseinblunt!_test1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: 'IM Fell English', serif;
    color: white;
}

/* ВИДЕО */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100vw;
    min-height: 100vh;
    object-fit: cover;
    z-index: -2;
}

/* затемнение */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

/* центр */
.container {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* 🔥 ЛОГО С VHS ТРЯСКОЙ */
.logo {
    width: 300px;
    margin-bottom: 50px;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
    animation: shake 0.12s infinite;
}

/* тряска как пленка */
@keyframes shake {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    25% { transform: translate(1px, -1px) rotate(-0.3deg); }
    50% { transform: translate(-1px, 1px) rotate(0.3deg); }
    75% { transform: translate(1px, 1px) rotate(-0.2deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
}

/* кнопка */
a {
    color: white;
    border: 1px solid white;
    padding: 10px 22px;
    text-decoration: none;
    letter-spacing: 2px;
    transition: 0.3s;
}

a:hover {
    background: white;
    color: black;
}

</style>
</head>

<body>

<video autoplay muted loop id="bg-video">
  <source src="video2.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
    <img src="logo.png" class="logo">
    <a href="links.html">LISTEN</a>
</div>

</body>
</html>
