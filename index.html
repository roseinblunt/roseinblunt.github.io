<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROSE IN BLUNT</title>

<!-- ВИНТАЖНЫЙ ШРИФТ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: 'IM Fell English', serif;
    color: white;
}

/* ВИДЕО ФОН */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    
    min-width: 100vw;
    min-height: 100vh;
    
    width: auto;
    height: auto;
    
    object-fit: cover;
    
    z-index: -2;
}

/* затемнение */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

/* центр */
.container {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* логотип */
.logo {
    width: 70px;
    height: auto;
    margin-bottom: 25px;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
    
    animation: float 5s ease-in-out infinite;
}

/* кнопка */
a {
    color: white;
    border: 1px solid white;
    padding: 10px 22px;
    text-decoration: none;
    letter-spacing: 2px;
    transition: 0.3s;
}

a:hover {
    background: white;
    color: black;
}

/* лёгкое “дыхание” */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
    100% { transform: translateY(0px); }
}

</style>
</head>

<body>

<!-- ВИДЕО -->
<video autoplay muted loop id="bg-video">
  <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- КОНТЕНТ -->
<div class="container">
    <img src="logo.png" class="logo">
    <a href="#">LISTEN</a>
</div>

</body>
</html>
</body>
</html>
