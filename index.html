<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>roseinblunt!</title>

<link rel="icon" href="favicon5.ico">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: 'IM Fell English', serif;
    color: white;
    isolation: isolate;
}

/* VIDEO */
#bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
    mix-blend-mode: difference;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* LOGO */
.logo {
    width: 300px;
    margin-bottom: 50px;
    animation: shake 0.3s infinite, flicker 2s infinite;
    mix-blend-mode: difference;
}

/* ТРЯСКА (ЕДИНАЯ) */
@keyframes shake {
    0% { transform: translate(0,0); }
    50% { transform: translate(1px,-1px); }
    100% { transform: translate(0,0); }
}

/* FLICKER */
@keyframes flicker {
    0%,100% { opacity:1; }
    50% { opacity:0.9; }
}

/* КНОПКИ */
.main-btn, .secondary {
    animation: shake 0.2s infinite;
    text-decoration: none;
    color: white;
    letter-spacing: 3px;
    text-shadow: 0 0 5px white;
    mix-blend-mode: difference;
    cursor: pointer;
}

.secondary {
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.3;
}

.main-btn:hover, .secondary:hover {
    opacity: 0.6;
}

/* GLITCH */
.glitch {
    animation: glitch 0.25s;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-5px,3px); filter: invert(1); }
    100% { transform: translate(0); }
}

</style>
</head>

<body>

<audio id="hoverSound" src="hover.mp3"></audio>
<audio id="clickSound" src="click.mp3"></audio>

<video autoplay muted loop playsinline id="bg-video">
  <source src="video2.mp4">
</video>

<div class="overlay"></div>

<div class="container">
    <img src="logo.png" class="logo" id="logo">

    <a href="links.html" class="main-btn" id="invoke">† LINKS †</a>

    <div class="secondary">† MERCH †</div>
    <div class="secondary">† TICKETS †</div>
</div>

<script>
let unlocked=false;
const h=document.getElementById("hoverSound");
const c=document.getElementById("clickSound");

document.addEventListener("mousemove",()=>unlocked=true);
document.addEventListener("click",()=>unlocked=true);

document.querySelectorAll("*").forEach(el=>{
    el.addEventListener("mouseenter",()=>{
        if(!unlocked) return;
        h.currentTime=0; h.play();
    });
});

document.getElementById("invoke").onclick=(e)=>{
    e.preventDefault();
    if(unlocked){c.currentTime=0;c.play();}
    document.body.classList.add("glitch");
    setTimeout(()=>location.href="links.html",200);
};

document.getElementById("logo").onclick=()=>{
    if(unlocked){c.currentTime=0;c.play();}
    location.href="secret.html";
};
</script>

</body>
</html>
