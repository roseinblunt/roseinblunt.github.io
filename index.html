<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>roseinblunt!</title>
<link rel="icon" type="image/x-icon" href="favicon5.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: 'IM Fell English', serif;
    color: white;
     isolation: isolate;
}

/* ВИДЕО */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100vw;
    min-height: 100vh;
    object-fit: cover;
    z-index: -2;
    mix-blend-mode: difference;
}

/* затемнение */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

/* центр */
.container {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* 🔥 ЛОГО С VHS ТРЯСКОЙ */
.logo {
    width: 300px;
    margin-bottom: 50px;
    
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
    
    animation: 
        shake 0.3s infinite,
        flicker 2s infinite;
    
     mix-blend-mode: difference;

    filter: 
        drop-shadow(0 0 8px rgba(255,255,255,0.25))
        drop-shadow(0 0 20px rgba(255,255,255,0.1));
}

/* тряска как пленка */
@keyframes shake {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    25% { transform: translate(0.4px, -0.4px) rotate(-0.2deg); }
    50% { transform: translate(-0.4px, 0.4px) rotate(0.2deg); }
    75% { transform: translate(0.4px, 0.4px) rotate(-0.07deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
}


@keyframes flicker {
    0% { opacity: 1; }
    5% { opacity: 0.85; }
    10% { opacity: 1; }
    15% { opacity: 0.9; }
    20% { opacity: 1; }
    50% { opacity: 0.95; }
    80% { opacity: 1; }
    100% { opacity: 0.98; }
}

/* кнопка */
a {
    animation: shakerr 0.3s infinite;
    color: white;
    text-decoration: none;
    letter-spacing: 2px;
    transition: 0.3s;
   
    text-shadow: 0 0 5px white;
     mix-blend-mode: difference;
}
    @keyframes shakerr {
    0% { transform: translate(0px, 0px); }
    50% { transform: translate(1px, -1px); }
    100% { transform: translate(0px, 0px); }
}    

a:hover {
    opacity: 0.6;
}

</style>
</head>

<body>

<video autoplay muted loop id="bg-video">
  <source src="video2.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
    <img src="logo.png" class="logo">
    <a href="links.html">† INVOKE †</a>
</div>

</body>
</html>
