<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>roseinblunt!</title>

<link rel="icon" type="image/x-icon" href="favicon5.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: 'IM Fell English', serif;
    color: white;
    isolation: isolate;
}

/* ВИДЕО */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100vw;
    min-height: 100vh;
    object-fit: cover;
    z-index: -2;
    mix-blend-mode: difference;
}

/* overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

/* центр */
.container {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* ЛОГО */
.logo {
    width: 300px;
    margin-bottom: 50px;

    animation: shake 0.3s infinite, flicker 2s infinite;
    mix-blend-mode: difference;

    filter:
        drop-shadow(0 0 8px rgba(255,255,255,0.25))
        drop-shadow(0 0 20px rgba(255,255,255,0.1));
}

/* тряска */
@keyframes shake {
    0% { transform: translate(0px, 0px) rotate(0deg); }
    25% { transform: translate(0.4px, -0.4px) rotate(-0.2deg); }
    50% { transform: translate(-0.4px, 0.4px) rotate(0.2deg); }
    75% { transform: translate(0.4px, 0.4px) rotate(-0.07deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
}

/* мерцание */
@keyframes flicker {
    0% { opacity: 1; }
    5% { opacity: 0.85; }
    10% { opacity: 1; }
    15% { opacity: 0.9; }
    20% { opacity: 1; }
    50% { opacity: 0.95; }
    80% { opacity: 1; }
    100% { opacity: 0.98; }
}

/* ГЛАВНАЯ КНОПКА */
.main-btn {
    opacity: 0;
    animation: fadeIn 2s forwards;
    animation-delay: 1.2s;

    animation-name: fadeIn, shakerr;
    animation-duration: 2s, 0.2s;
    animation-delay: 1.2s, 1.2s;
    animation-fill-mode: forwards;

    color: white;
    text-decoration: none;
    letter-spacing: 3px;
    text-shadow: 0 0 5px white;
    mix-blend-mode: difference;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes shakerr {
    0% { transform: translate(0px, 0px); }
    50% { transform: translate(0.7px, -0.7px); }
    100% { transform: translate(0px, 0px); }
}

.main-btn:hover {
    opacity: 0.6;
}

/* ВТОРИЧНЫЕ */
.secondary {
    margin-top: 20px;
    font-size: 12px;
    opacity: 0.25;
    transition: 0.3s;
}

.secondary:hover {
    opacity: 0.7;
}

/* микро текст */
.whisper {
    position: absolute;
    bottom: 30px;
    font-size: 10px;
    opacity: 0.15;
    letter-spacing: 2px;
}

/* ГЛИТЧ ЭФФЕКТ */
.glitch {
    animation: glitch 0.25s;
}

@keyframes glitch {
    0% { transform: translate(0); filter: invert(0); }
    20% { transform: translate(-5px, 3px); filter: invert(1); }
    40% { transform: translate(5px, -3px); }
    60% { transform: translate(-3px, 2px); }
    80% { transform: translate(3px, -2px); }
    100% { transform: translate(0); filter: invert(0); }
}

/* адаптив */
@media (max-width: 768px) {
    .logo { width: 180px; }
}

</style>
</head>

<body>

<video autoplay muted loop playsinline id="bg-video">
  <source src="video2.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

    <img src="logo.png" class="logo" id="logo">

    <a href="links.html" class="main-btn" id="invoke">† LINKS †</a>

    <div class="secondary">† MERCH † (soon)</div>
    <div class="secondary">† TICKETS † (soon)</div>

</div>

<div class="whisper">nothing is real</div>

<script>

/* ГЛИТЧ ПРИ КЛИКЕ */
document.getElementById("invoke").addEventListener("click", function(e){
    e.preventDefault();
    document.body.classList.add("glitch");

    setTimeout(() => {
        window.location.href = "links.html";
    }, 200);
});

/* СЕКРЕТ — 5 кликов по лого */
let clicks = 0;
document.getElementById("logo").addEventListener("click", () => {
    clicks++;
    if(clicks >= 5){
        window.location.href = "secret.html";
    }
});

</script>

</body>
</html>
