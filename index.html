<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>roseinblunt!</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
}

/* ВИДЕО ФОН */
#bg-video {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: -2;
}

/* затемнение */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -1;
}

/* контент */
.container {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

h1 {
    font-size: 60px;
    letter-spacing: 8px;
}

p {
    opacity: 0.7;
    margin-bottom: 20px;
}

a {
    color: white;
    border: 1px solid white;
    padding: 10px 20px;
    text-decoration: none;
    transition: 0.3s;
}

a:hover {
    background: white;
    color: black;
}
</style>
</head>

<body>

<!-- ВИДЕО -->
<video autoplay muted loop id="bg-video">
  <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
    <h1>roseinblunt!</h1>
    <p>soon you will see</p>
    <a href="#">merch</a>
</div>

</body>
</html>
