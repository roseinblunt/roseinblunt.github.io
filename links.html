<style>

body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: 'IM Fell English', serif;
    color: white;
}

/* ВИДЕО ФОН */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100vw;
    min-height: 100vh;
    object-fit: cover;
    z-index: -2;
}

/* затемнение */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -1;
}

/* контейнер */
.container {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* кнопки */
.link {
    margin: 8px;
    padding: 12px 30px;
    border: 1px solid white;
    color: white;
    text-decoration: none;
    letter-spacing: 2px;
    transition: 0.3s;
}

.link:hover {
    background: white;
    color: black;
}

/* лёгкая тряска текста */
.link {
    animation: shake 0.2s infinite;
}

@keyframes shake {
    0% { transform: translate(0px, 0px); }
    50% { transform: translate(1px, -1px); }
    100% { transform: translate(0px, 0px); }
}

</style>
</head>

<body>

<video autoplay muted loop id="bg-video">
  <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
