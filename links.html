<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>links</title>

<link rel="icon" href="favicon5.ico">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>
body {margin:0;background:black;color:white;font-family:'IM Fell English';overflow:hidden;}

#bg-video {
    position:fixed; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:-2;
}

.overlay {position:fixed; inset:0; background:rgba(0,0,0,0.55);}

.container {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* ССЫЛКИ */
.link {
    margin:8px;
    letter-spacing:2px;
    text-decoration:none;
    color:white;
    text-shadow:0 0 5px white;
    mix-blend-mode:difference;
    animation: shake 0.2s infinite;
}

/* RETURN */
.back {
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    animation: shake 0.2s infinite;
    cursor:pointer;
    opacity:0.4;
}

.back:hover {opacity:0.8;}

@keyframes shake {
    0%{transform:translate(0,0);}
    50%{transform:translate(1px,-1px);}
    100%{transform:translate(0,0);}
}

.glitch {animation:glitch 0.25s;}
@keyframes glitch {
    20%{transform:translate(-5px,3px);filter:invert(1);}
}
</style>
</head>

<body>

<audio id="hoverSound" src="hover.mp3"></audio>
<audio id="clickSound" src="click.mp3"></audio>

<video autoplay muted loop playsinline id="bg-video">
  <source src="video.mp4">
</video>

<div class="overlay"></div>

<div class="container">
<a class="link" href="#">† SØUNDCLØUD †</a>
<a class="link" href="#">† SPØTIFY †</a>
<a class="link" href="#">† YØUTUBE †</a>
<a class="link" href="#">† ÅPPLE MÜSIC †</a>
<a class="link" href="#">† TIK†TOK †</a>
<a class="link" href="#">† INSTÅGRÅM †</a>
<a class="link" href="#">† TELEGRÅM †</a>
</div>

<div class="back" onclick="goBack()">† RETURN †</div>

<script>
let unlocked=false;
const h=document.getElementById("hoverSound");
const c=document.getElementById("clickSound");

document.addEventListener("mousemove",()=>unlocked=true);
document.addEventListener("click",()=>unlocked=true);

document.querySelectorAll("a,.back").forEach(el=>{
    el.onmouseenter=()=>{ if(unlocked){h.currentTime=0;h.play();} };
    el.onclick=(e)=>{
        if(unlocked){c.currentTime=0;c.play();}
    };
});

function goBack(){
    document.body.classList.add("glitch");
    setTimeout(()=>location.href="index.html",200);
}
</script>

</body>
</html>
