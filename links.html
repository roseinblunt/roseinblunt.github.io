<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>links</title>

<link rel="icon" href="favicon5.ico">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>

body {margin:0;background:black;color:white;font-family:'IM Fell English'}

#bg-video {
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay {
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:-1;
}

.container {
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

/* LINKS */
.link, .back {
animation: shake 0.2s infinite;
}

@keyframes shake {
0%{transform:translate(0)}
50%{transform:translate(1px,-1px)}
100%{transform:translate(0)}
}

.link {
margin:8px;
text-decoration:none;
color:white;
text-shadow:0 0 5px white;
}

.back {
position:fixed;
bottom:30px;
cursor:pointer;
opacity:0.4;
}

.glitch-transition {
animation: glitch 0.25s;
}

@keyframes glitch {
20%{transform:translate(-6px,3px);filter:invert(1)}
}

</style>
</head>

<body>

<audio id="hoverSound" src="hover.mp3"></audio>
<audio id="clickSound" src="click.mp3"></audio>

<video autoplay muted loop playsinline id="bg-video">
<source src="video.mp4">
</video>

<div class="overlay"></div>

<div class="container">
<a class="link" href="#">† SØUNDCLØUD †</a>
<a class="link" href="#">† SPØTIFY †</a>
<a class="link" href="#">† YØUTUBE †</a>
</div>

<div class="back" onclick="goBack()">† RETURN †</div>

<script>
let audioUnlocked=false;
const hoverSound=document.getElementById("hoverSound");
const clickSound=document.getElementById("clickSound");

document.addEventListener("click",()=>audioUnlocked=true);

document.querySelectorAll(".link,.back").forEach(el=>{
 el.onmouseenter=()=>{
  if(!audioUnlocked)return;
  hoverSound.currentTime=0;
  hoverSound.play();
 };
});

function goBack(){
 clickSound.play();
 document.body.classList.add("glitch-transition");
 setTimeout(()=>location.href="index.html",200);
}
</script>

</body>
</html>
