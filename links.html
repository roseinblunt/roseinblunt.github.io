<style>

body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: 'IM Fell English', serif;
    color: white;
}

/* VIDEO */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100vw;
    min-height: 100vh;
    object-fit: cover;
    z-index: -2;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

.container {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* LINKS */
.link {
    margin: 8px;
    padding: 12px 30px;
    color: white;
    text-decoration: none;
    letter-spacing: 2px;
    text-shadow: 0 0 5px white;
    mix-blend-mode: difference;
    animation: shake 0.2s infinite;
    transition: 0.3s;
}

.link:hover {
    opacity: 0.6;
}

@keyframes shake {
    0% { transform: translate(0px, 0px); }
    50% { transform: translate(1px, -1px); }
    100% { transform: translate(0px, 0px); }
}

/* RETURN */
.back {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 3px;
    opacity: 0.4;
    cursor: pointer;
    transition: 0.3s;
    color: white;
    text-shadow: 0 0 5px white;
    z-index: 10;
}

.back:hover {
    opacity: 0.8;
}

/* GLITCH EFFECT */
.glitch {
    animation: glitch 0.25s;
}

@keyframes glitch {
    0% { transform: translate(0); filter: invert(0); }
    20% { transform: translate(-5px, 3px); }
    40% { transform: translate(5px, -3px); }
    60% { transform: translate(-3px, 2px); }
    80% { transform: translate(3px, -2px); }
    100% { transform: translate(0); filter: invert(0); }
}

</style>
</head>

<body>

  <source src="video.mp4" type="video/mp4">
