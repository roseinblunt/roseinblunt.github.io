<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>roseinblunt! — LINKS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: 'IM Fell English', serif;
    
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
/* ВИДЕО ФОН */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    
    min-width: 100vw;
    min-height: 100vh;
    
    width: auto;
    height: auto;
    
    object-fit: cover;
    
    z-index: -2;
}

/* затемнение */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

/* центр */
.container {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    text-align: center;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}


/* кнопки */
.link {
    display: block;
    margin: 10px 0;
    padding: 12px 25px;
    border: 1px solid white;
    color: white;
    text-decoration: none;
    letter-spacing: 2px;
    transition: 0.3s;
}

.link:hover {
    background: white;
    color: black;
}
</style>
</head>

<body>
<!-- ВИДЕО -->
<video autoplay muted loop id="bg-video">
  <source src="video2.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<div class="container">

    <a class="link" href="https://soundcloud.com" target="_blank">SOUNDCLOUD</a>
    <a class="link" href="https://spotify.com" target="_blank">SPOTIFY</a>
    <a class="link" href="https://youtube.com" target="_blank">YOUTUBE</a>
    <a class="link" href="https://music.apple.com" target="_blank">APPLE MUSIC</a>
    <a class="link" href="https://tiktok.com" target="_blank">TIKTOK</a>
    <a class="link" href="https://instagram.com" target="_blank">INSTAGRAM</a>
    <a class="link" href="https://telegram.org" target="_blank">TELEGRAM</a>

</div>

</body>
</html>
