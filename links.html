<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>roseinblunt! — links</title>

<link rel="icon" type="image/x-icon" href="favicon5.ico">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: 'IM Fell English', serif;
    color: white;
}

/* VIDEO */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100vw;
    min-height: 100vh;
    object-fit: cover;
    z-index: -2;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: -1;
}

.container {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* LINKS */
.link {
    margin: 8px;
    padding: 12px 30px;
    color: white;
    text-decoration: none;
    letter-spacing: 2px;
    text-shadow: 0 0 5px white;
    mix-blend-mode: difference;
    animation: shake 0.2s infinite;
    transition: 0.3s;
}

.link:hover {
    opacity: 0.6;
}

@keyframes shake {
    0% { transform: translate(0px, 0px); }
    50% { transform: translate(1px, -1px); }
    100% { transform: translate(0px, 0px); }
}

/* RETURN */
.back {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 3px;
    opacity: 0.4;
    cursor: pointer;
    transition: 0.3s;
    color: white;
    text-shadow: 0 0 5px white;
    z-index: 10;
}

.back:hover {
    opacity: 0.8;
}

/* GLITCH EFFECT */
.glitch-transition {
    animation: glitchBurst 0.25s ease-in-out;
}

@keyframes glitchBurst {
    0% { transform: translate(0); filter: none; }
    20% { transform: translate(-6px, 3px); filter: invert(1); }
    40% { transform: translate(6px, -3px); filter: invert(0); }
    60% { transform: translate(-3px, 2px); }
    80% { transform: translate(3px, -2px); }
    100% { transform: translate(0); filter: none; }
}

</style>
</head>

<body>

<!-- 🔊 AUDIO -->
<audio id="hoverSound" src="hover.mp3"></audio>
<audio id="clickSound" src="click.mp3"></audio>

<video autoplay muted loop playsinline id="bg-video">
  <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

    <a class="link" href="https://soundcloud.com/roseinblunt" target="_blank">† SØUNDCLØUD †</a>
    <a class="link" href="https://open.spotify.com/artist/4tIKczrEo6trUkUALAy8gq?si=Ei4O_Oh0TsCxOLmU-t5ESw" target="_blank">† SPØTIFY †</a>
    <a class="link" href="https://www.youtube.com/@roseinblunt" target="_blank">† YØUTUBE †</a>
    <a class="link" href="https://music.apple.com/us/artist/roseinblunt/1802382899" target="_blank">† ÅPPLE MÜSIC †</a>
    <a class="link" href="https://www.tiktok.com/@roseinbluntt" target="_blank">† TIK†TOK †</a>
    <a class="link" href="https://www.instagram.com/roseinblunt/" target="_blank">† INSTÅGRÅM †</a>
    <a class="link" href="https://t.me/roseinbluntt" target="_blank">† TELEGRÅM †</a>

</div>

<div class="back" onclick="goBack()">† RETURN †</div>

<script>

/* 🔓 разблокировка звука */
let audioUnlocked = false;
const hoverSound = document.getElementById("hoverSound");
const clickSound = document.getElementById("clickSound");

function unlockAudio() {
    if (!audioUnlocked) {
        audioUnlocked = true;
    }
}

document.addEventListener("click", unlockAudio);
document.addEventListener("mousemove", unlockAudio);

/* 🔊 hover */
document.querySelectorAll(".link, .back").forEach(el => {
    el.addEventListener("mouseenter", () => {
        if (!audioUnlocked) return;
        hoverSound.currentTime = 0;
        hoverSound.play();
    });
});

/* 🔊 click на ссылки */
document.querySelectorAll(".link").forEach(el => {
    el.addEventListener("click", () => {
        if (!audioUnlocked) return;
        clickSound.currentTime = 0;
        clickSound.play();
    });
});

/* 🔊 RETURN */
function goBack() {

    if (audioUnlocked) {
        clickSound.currentTime = 0;
        clickSound.play();
    }

    document.body.classList.add("glitch-transition");

    setTimeout(() => {
        window.location.href = "index.html";
    }, 220);
}

</script>

</body>
</html>
