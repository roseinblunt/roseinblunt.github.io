<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROSE IN BLUNT — LINKS</title>

<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: 'IM Fell English', serif;
    
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    text-align: center;
}

/* кнопки */
.link {
    display: block;
    margin: 10px 0;
    padding: 12px 25px;
    border: 1px solid white;
    color: white;
    text-decoration: none;
    letter-spacing: 2px;
    transition: 0.3s;
}

.link:hover {
    background: white;
    color: black;
}
</style>
</head>

<body>

<div class="container">

    <a class="link" href="https://soundcloud.com" target="_blank">SOUNDCLOUD</a>
    <a class="link" href="https://spotify.com" target="_blank">SPOTIFY</a>
    <a class="link" href="https://youtube.com" target="_blank">YOUTUBE</a>
    <a class="link" href="https://music.apple.com" target="_blank">APPLE MUSIC</a>
    <a class="link" href="https://tiktok.com" target="_blank">TIKTOK</a>
    <a class="link" href="https://instagram.com" target="_blank">INSTAGRAM</a>
    <a class="link" href="https://telegram.org" target="_blank">TELEGRAM</a>

</div>

</body>
</html>
