<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="favicon5.ico">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>
body {margin:0;background:black;color:white;font-family:'IM Fell English';overflow:hidden;}

#bg-video {
    position:fixed; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0.35;
    z-index:-2;
}

.overlay {position:fixed; inset:0; background:rgba(0,0,0,0.7);}

.container {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

/* ТРЯСКА */
@keyframes shake {
    0%{transform:translate(0,0);}
    50%{transform:translate(1px,-1px);}
    100%{transform:translate(0,0);}
}

/* IMAGE */
.newspaper {
    width:260px;
    margin-bottom:40px;
    animation: shake 0.2s infinite;
}

/* TEXT */
.message {
    text-align:center;
    max-width:650px;
    letter-spacing:2px;
    text-shadow:0 0 8px white;
    animation: shake 0.2s infinite;
}

/* RETURN */
.back {
    margin-top:50px;
    opacity:0.4;
    cursor:pointer;
    animation: shake 0.2s infinite;
}

.back:hover {opacity:0.8;}

.glitch {animation:glitch 0.25s;}
@keyframes glitch {
    20%{transform:translate(-5px,3px);filter:invert(1);}
}
</style>
</head>

<body>

<audio id="hoverSound" src="hover.mp3"></audio>
<audio id="clickSound" src="click.mp3"></audio>

<video autoplay muted loop playsinline id="bg-video">
  <source src="video.mp4">
</video>

<div class="overlay"></div>

<div class="container">

<img src="newspaper.png" class="newspaper">

<div class="message">
You have been called forth from the ranks of man.<br><br>
In dreams and in song, the eternal mind spoke to you...<br><br>
Bow and pray...
</div>

<div class="back" onclick="goBack()">† RETURN †</div>

</div>

<script>
let unlocked=false;
const h=document.getElementById("hoverSound");
const c=document.getElementById("clickSound");

document.addEventListener("mousemove",()=>unlocked=true);
document.addEventListener("click",()=>unlocked=true);

document.querySelectorAll(".back,.newspaper,.message").forEach(el=>{
    el.onmouseenter=()=>{ if(unlocked){h.currentTime=0;h.play();} };
    el.onclick=()=>{ if(unlocked){c.currentTime=0;c.play();} };
});

function goBack(){
    document.body.classList.add("glitch");
    setTimeout(()=>location.href="index.html",200);
}
</script>

</body>
</html>
