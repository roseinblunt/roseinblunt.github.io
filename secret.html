<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>... 2</title>

<link rel="icon" type="image/x-icon" href="favicon5.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    background: black;
    color: white;
    font-family: 'IM Fell English', serif;
    overflow: hidden;
}

/* видео фон (другой, более спокойный) */
#bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.35;
    z-index: -2;
}

/* затемнение */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: -1;
}

/* центр */
.container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* текст */
.message {
    font-size: 14px;
    letter-spacing: 2px;
    opacity: 0;
    text-align: center;
    max-width: 600px;
    animation: fadeIn 3s forwards;
    animation-delay: 1s;
}

/* появление */
@keyframes fadeIn {
    to { opacity: 0.8; }
}

/* кнопка назад */
.back {
    margin-top: 40px;
    font-size: 12px;
    opacity: 0.3;
    cursor: pointer;
    transition: 0.3s;
}

.back:hover {
    opacity: 0.7;
}

/* лёгкий шум текста */
.glitch-text {
    animation: none;
}

@keyframes textShake {
    0% { transform: translate(0px); }
    50% { transform: translate(0.5px, -0.5px); }
    100% { transform: translate(0px); }
}

/* адаптив */
@media (max-width: 768px) {
    .message {
        font-size: 12px;
        padding: 0 20px;
    }
}

</style>
</head>

<body>

<!-- видео -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

    <div class="message glitch-text">
        there is no audience<br><br>
        only witnesses<br><br><br>
        nothing is real<br><br>
        and yet you are here
    </div>

    <div class="back" onclick="goBack()">† RETURN †</div>

</div>

<script>
function goBack() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
