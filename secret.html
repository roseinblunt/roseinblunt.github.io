<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>

<link rel="icon" type="image/x-icon" href="favicon5.ico">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    background: black;
    color: white;
    font-family: 'IM Fell English', serif;
    overflow: hidden;
}

#bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.35;
    z-index: -2;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: -1;
}

.container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.message {
    font-size: 16px;
    letter-spacing: 2px;
    text-align: center;
    max-width: 600px;
    opacity: 0;
    animation: fadeIn 2s forwards;
    animation-delay: 0.8s;
    text-shadow: 0 0 10px white;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* RETURN */
.back {
    margin-top: 50px;
    font-size: 12px;
    letter-spacing: 3px;
    opacity: 0.4;
    cursor: pointer;
    transition: 0.3s;
}

.back:hover {
    opacity: 0.8;
}

/* GLITCH */
.glitch {
    animation: glitch 0.25s;
}

@keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-5px, 3px); }
    40% { transform: translate(5px, -3px); }
    60% { transform: translate(-3px, 2px); }
    80% { transform: translate(3px, -2px); }
    100% { transform: translate(0); }
}

</style>
</head>

<body>

<video autoplay muted loop playsinline id="bg-video">
  <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

    <div class="message">
        there is no audience<br><br>
        only witnesses<br><br><br>
        nothing is real<br><br>
        and yet you are here
    </div>

    <div class="back" onclick="goBack()">† RETURN †</div>

</div>

<script>

function goBack() {
    document.body.classList.add("glitch");

    setTimeout(() => {
        window.location.href = "index.html";
    }, 200);
}

</script>

</body>
</html>
